[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "powderpolyxtalseg"
version = "1.0.0"
description = "Semantic segmentation of HEDM spots and powder diffraction rings in area-detector images"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
    "h5py>=3.6",
    "tifffile>=2021.11.2",
    "tqdm>=4.62",
]

[project.optional-dependencies]
segformer = ["transformers>=4.30"]
plots = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["powderpolyxtalseg*", "configs*"]
